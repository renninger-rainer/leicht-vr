<html lang="de"><head><meta charset="utf-8"><title>LEICHT</title><meta name="robots" content="noindex,nofollow">
<script>

(function () { var base = '/' + (location.pathname.split('/')[1] || '') + '/'; if (location.hostname === 'localhost' && !/^\/leicht-vr\//.test(location.pathname)) base = '/';
